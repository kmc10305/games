const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
// Synthesized effects: no external audio assets or network requests.
let audioCtx=null,master=null,noiseBuffer=null,soundOn=true;
const lastSound={};
function unlockAudio(){
 if(!soundOn)return;
 try{
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){$('sound').textContent='소리 미지원';$('sound').disabled=true;return}audioCtx=new AC();master=audioCtx.createGain();master.gain.value=.28;master.connect(audioCtx.destination);noiseBuffer=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*.15),audioCtx.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1}
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 }catch(e){soundOn=false;$('sound').textContent='소리 꺼짐';$('sound').setAttribute('aria-pressed','false')}
}
function tone(freq,duration,volume,type='sine',delay=0,endFreq=freq){
 const at=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),at+duration);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(volume,at+.004);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(master);o.start(at);o.stop(at+duration+.01);o.onended=()=>{o.disconnect();g.disconnect()};
}
function burst(){const at=audioCtx.currentTime,n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();n.buffer=noiseBuffer;f.type='highpass';f.frequency.value=1100;g.gain.setValueAtTime(.38,at);g.gain.exponentialRampToValueAtTime(.0001,at+.075);n.connect(f);f.connect(g);g.connect(master);n.start(at);n.stop(at+.08);n.onended=()=>{n.disconnect();f.disconnect();g.disconnect()}}
function sfx(kind){if(!soundOn||!audioCtx||audioCtx.state!=='running')return;const now=audioCtx.currentTime;if(now-(lastSound[kind]??-100)<(kind==='kill'?.08:.035))return;lastSound[kind]=now;
 try{switch(kind){case 'shot':burst();tone(150,.07,.3,'triangle',0,45);break;case 'kill':tone(550,.09,.1,'triangle',0,210);break;case 'hurt':tone(160,.18,.24,'sawtooth',0,55);break;case 'level':[440,554,659].forEach((f,i)=>tone(f,.17,.18,'sine',i*.1));break;case 'select':tone(760,.12,.15,'sine',0,1050);break;case 'boss':[140,140,95].forEach((f,i)=>tone(f,.2,.2,'sawtooth',i*.22));break;case 'pulse':tone(160,.25,.15,'sine',0,600);break;case 'win':[523,659,784,1047].forEach((f,i)=>tone(f,.35,.2,'triangle',i*.15));break;case 'lose':[330,247,165].forEach((f,i)=>tone(f,.3,.16,'triangle',i*.18));break}}catch(e){}
}
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn)unlockAudio();if(master)master.gain.setTargetAtTime(soundOn?.28:0,audioCtx.currentTime,.015);$('sound').textContent=soundOn?'소리 켬':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'효과음 끄기':'효과음 켜기');if(soundOn)sfx('select')};

const POLICIES=[{name:'책임에 맞는 보상',effect:'대응탄 공격력 +35%',detail:'책임·직무 난이도를 반영한 보상체계',apply:s=>s.damage*=1.35},{name:'행정업무 간소화',effect:'자동 공격 간격 18% 단축',detail:'부대관리·행정업무 축소와 업무 재설계',apply:s=>s.interval=Math.max(.14,s.interval*.82)},{name:'책임에 상응하는 권한',effect:'대응탄 관통 +1',detail:'권한 위임 확대와 역할·책임의 명확화',apply:s=>s.pierce++},{name:'합리적인 소통',effect:'주변 위협을 밀어내는 소통 파동 강화',detail:'리더십 개선과 합리적인 의사소통 구조',apply:s=>s.aura++},{name:'예측 가능한 경력',effect:'이동 속도 +12% · 경험 수집 범위 +35%',detail:'보직·경력경로의 예측 가능성과 공정성',apply:s=>{s.speed*=1.12;s.magnet*=1.35}},{name:'가족생활 지원',effect:'최대 복무 의지 +25 · 즉시 35 회복',detail:'주거·교육·가족지원의 연계',apply:s=>{s.maxhp+=25;s.hp=Math.min(s.maxhp,s.hp+35)}},{name:'휴식·재충전 보장',effect:'매초 복무 의지 0.6 회복 추가',detail:'휴식·교육·자기계발 여건 개선',apply:s=>s.regen+=.6}];

function reset(){unlockAudio();s={x:0,y:0,hp:100,maxhp:100,speed:155,damage:24,interval:.58,pierce:0,aura:0,regen:0,magnet:74,xp:0,need:5,level:1,time:0,kills:0,shot:0,spawn:0,pulse:0,inv:0,boss:false,chosen:[]};enemies=[];bullets=[];gems=[];sparks=[];stick=null;keys={};state='play';$('overlay').hidden=true;$('bossbar').hidden=true;$('toast').textContent='';$('pause').textContent='Ⅱ';updateHUD()}
function show(html){$('panel').innerHTML=html;$('overlay').hidden=false;stick=null;keys={};$('panel').querySelector('button')?.focus()}
function intro(){show('<div class="eyebrow">OFFICER SURVIVAL / PILOT</div><h1>중견간부<br>생존기<span style="color:var(--lime)">.</span></h1><p>몰려오는 복무의 부담.<br>정책을 조합하고, 살아남을 조건을 만들어라.</p><div class="rules"><span>실시간 자동 공격</span><span>무작위 정책 선택</span><span>3분 작전</span></div><p>이동하며 위협을 피하고 푸른 경험 조각을 모으세요. 2분 30초에 나타나는 최종 위협을 해소하고 3분까지 생존하면 승리합니다.</p><button class="primary" id="start">생존 시작</button><p class="note">정책보고서의 5개 분석영역을 재구성한 시범 게임</p>');$('start').onclick=reset}intro();
function toast(t){$('toast').textContent=t;toastUntil=s.time+3}
function levelup(){sfx('level');state='upgrade';s.xp-=s.need;s.level++;s.need=Math.round(s.need*1.22+2);let pool=[...POLICIES];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool=pool.slice(0,3);show('<div class="eyebrow">LEVEL '+s.level+' / POLICY SELECT</div><h2>다음 정책을 선택하세요</h2><p>한 가지를 선택하면 즉시 적용됩니다.</p>'+pool.map((p,i)=>'<button class="choice" data-i="'+i+'"><b>'+p.name+'</b><span>'+p.effect+'</span><small>'+p.detail+'</small></button>').join('')+'<p class="note">능력 수치는 게임용 설정이며 실제 정책 효과의 추정치가 아닙니다.</p>');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const p=pool[+b.dataset.i];sfx('select');p.apply(s);s.chosen.push(p.name);state='play';$('overlay').hidden=true;toast(p.name+' 적용');updateHUD()})}
function pause(){if(state==='play'){state='paused';show('<div class="eyebrow">OPERATION PAUSED</div><h2>잠시 재충전</h2><p>작전 시간이 멈춰 있습니다.</p><button id="resume" class="primary">계속하기</button><button id="restart" style="width:100%;margin-top:10px">처음부터 다시</button>');$('resume').onclick=resume;$('restart').onclick=reset}else if(state==='paused')resume()}
function resume(){unlockAudio();state='play';$('overlay').hidden=true;keys={};stick=null} $('pause').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});window.addEventListener('blur',()=>{keys={};stick=null;if(state==='play')pause()});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'||e.code==='Escape'){if(!e.repeat)pause()}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointerdown',e=>{if(state!=='play'||stick)return;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();stick={id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top,dx:0,dy:0}});canvas.addEventListener('pointermove',e=>{if(!stick||stick.id!==e.pointerId)return;const r=canvas.getBoundingClientRect(),dx=e.clientX-r.left-stick.x,dy=e.clientY-r.top-stick.y,d=Math.hypot(dx,dy)||1;stick.dx=dx/Math.max(45,d);stick.dy=dy/Math.max(45,d)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(stick?.id===e.pointerId)stick=null});
function spawn(boss=false){const a=Math.random()*Math.PI*2,r=Math.hypot(W,H)/2+45,t=Math.floor(Math.random()*Math.min(5,2+Math.floor(s.time/25))),type=TYPES[t],hp=boss?1200:type.hp*(1+s.time/160);enemies.push({x:s.x+Math.cos(a)*r,y:s.y+Math.sin(a)*r,hp,maxhp:hp,type:t,r:boss?34:15,speed:boss?48:type.speed*(1+s.time/260),boss,flash:0});if(boss){sfx('boss');s.boss=true;$('bossbar').hidden=false;toast('최종 위협 출현 · 이탈의 악순환')}}
function hit(e,damage){e.hp-=damage;e.flash=.08;if(e.hp<=0&&!e.dead){e.dead=true;sfx('kill');s.kills++;gems.push({x:e.x,y:e.y,value:e.boss?18:1});for(let i=0;i<5;i++)sparks.push({x:e.x,y:e.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.4,color:e.boss?'#ff6680':TYPES[e.type].color});if(e.boss){$('bossbar').hidden=true;toast('이탈의 악순환 해소! 끝까지 생존하세요.')}}}
function end(win){sfx(win?'win':'lose');state='end';show('<div class="eyebrow">'+(win?'MISSION COMPLETE':'OPERATION ENDED')+'</div><h2>'+(win?'복무지속성 향상!':'이번 작전 종료')+'</h2><p>'+(win?'보상·업무·조직문화·경력·가족지원이 함께 작동할 때, 숙련된 중견간부가 계속 기여할 수 있습니다.':'개인의 의지만으로는 모든 부담을 감당하기 어렵습니다. 다른 정책 조합으로 복무 여건을 바꿔보세요.')+'</p>'+(win?'<p class="ending-message">중견간부가 모든 어려움을<br>물리치고 만기전역하였다.<br>리센느처럼 우리군 흥하여라~</p>':'')+'<div class="stats"><div><strong>'+Math.floor(s.time)+'초</strong><small>생존 시간</small></div><div><strong>'+s.kills+'</strong><small>해소한 위협</small></div><div><strong>'+s.level+'</strong><small>도달 레벨</small></div></div><p class="note">선택한 정책: '+(Array.from(new Set(s.chosen)).join(' · ')||'없음')+'</p><button class="primary" id="again">다시 도전</button>');$('again').onclick=reset}
function update(dt){s.time+=dt;s.inv=Math.max(0,s.inv-dt);s.hp=Math.min(s.maxhp,s.hp+s.regen*dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(stick){dx=stick.dx;dy=stick.dy}let d=Math.max(1,Math.hypot(dx,dy));s.x+=dx/d*s.speed*dt;s.y+=dy/d*s.speed*dt;
s.spawn-=dt;if(s.spawn<=0){if(enemies.length<110)spawn();s.spawn=Math.max(.19,.85-s.time*.0035)}if(s.time>=150&&!s.boss)spawn(true);
s.shot-=dt;if(s.shot<=0&&enemies.length){let target=null,dist=Infinity;for(const e of enemies){const q=Math.hypot(e.x-s.x,e.y-s.y);if(!e.dead&&q<dist){dist=q;target=e}}if(target){let a=Math.atan2(target.y-s.y,target.x-s.x);bullets.push({x:s.x,y:s.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,life:2.2,left:s.pierce+1,seen:new Set()});s.shot=s.interval;sfx('shot')}}
s.pulse-=dt;if(s.aura&&s.pulse<=0){sfx('pulse');s.pulse=Math.max(.65,2.3-s.aura*.18);const r=90+s.aura*15;for(const e of enemies){let dd=Math.hypot(e.x-s.x,e.y-s.y);if(dd<r){hit(e,12+s.aura*10);e.x+=(e.x-s.x)/Math.max(1,dd)*24;e.y+=(e.y-s.y)/Math.max(1,dd)*24}}sparks.push({x:s.x,y:s.y,life:.45,ring:r,color:'#ccff72'})}
for(const e of enemies){if(e.dead)continue;let dx=s.x-e.x,dy=s.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.flash-=dt;if(d<e.r+13&&s.inv<=0){sfx('hurt');s.hp-=e.boss?20:10;s.inv=.8;e.x-=dx/d*30;e.y-=dy/d*30}if(d>Math.hypot(W,H)*1.5&&!e.boss){e.x=s.x-dx/d*(Math.hypot(W,H)/2+30);e.y=s.y-dy/d*(Math.hypot(W,H)/2+30)}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(!e.dead&&!b.seen.has(e)&&b.left>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.seen.add(e);hit(e,s.damage);b.left--}}}bullets=bullets.filter(b=>b.life>0&&b.left>0);enemies=enemies.filter(e=>!e.dead);
for(const g of gems){let dx=s.x-g.x,dy=s.y-g.y,d=Math.hypot(dx,dy);if(d<s.magnet){g.x+=dx/Math.max(1,d)*280*dt;g.y+=dy/Math.max(1,d)*280*dt}if(d<19){s.xp+=g.value;g.dead=true}}gems=gems.filter(g=>!g.dead);if(gems.length>220){const g=gems.shift();gems[0].value+=g.value}for(const p of sparks){p.life-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt}}sparks=sparks.filter(p=>p.life>0);if(s.time>toastUntil)$('toast').textContent='';updateHUD();if(s.hp<=0){end(false);return}if(s.time>=180){s.time=180;end(!enemies.some(e=>e.boss));return}if(s.xp>=s.need)levelup()}
function updateHUD(){const left=Math.max(0,Math.ceil(180-s.time));$('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('hp').style.width=Math.max(0,s.hp/s.maxhp*100)+'%';$('hpText').textContent=Math.max(0,Math.ceil(s.hp))+' / '+s.maxhp;$('kills').textContent=s.kills;$('xp').style.width=Math.min(100,s.xp/s.need*100)+'%';$('level').textContent='LV. '+s.level+' 중견간부';$('loadout').textContent=Array.from(new Set(s.chosen)).slice(-3).join(' · ')||'기본 대응탄';$('phase').textContent=s.time<150?'복무지속성 확보 작전':'최종 위협 해소 · 3분 생존';let b=enemies.find(e=>e.boss);if(b)$('bosshp').style.width=Math.max(0,b.hp/b.maxhp*100)+'%'}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.fillStyle='#112027';ctx.fillRect(0,0,W,H);let px=s?.x||0,py=s?.y||0;ctx.strokeStyle='#203239';ctx.lineWidth=1;for(let x=((W/2-px)%60+60)%60;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=((H/2-py)%60+60)%60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.save();ctx.translate(W/2-px,H/2-py);for(const g of gems){ctx.fillStyle='#80e5ff';ctx.beginPath();ctx.moveTo(g.x,g.y-6);ctx.lineTo(g.x+4,g.y);ctx.lineTo(g.x,g.y+6);ctx.lineTo(g.x-4,g.y);ctx.fill()}for(const e of enemies){const c=e.boss?'#ff6680':TYPES[e.type].color;circle(e.x,e.y,e.r,e.flash>0?'#fff':'#20303a',c);ctx.fillStyle=c;ctx.font='bold '+(e.boss?22:15)+'px system-ui';ctx.textAlign='center';ctx.fillText(e.boss?'!':String(e.type+1),e.x,e.y+5);ctx.font='12px system-ui';ctx.fillText(e.boss?'이탈의 악순환':TYPES[e.type].short,e.x,e.y+e.r+17);if(e.hp<e.maxhp){ctx.fillStyle='#34434a';ctx.fillRect(e.x-14,e.y-e.r-8,28,3);ctx.fillStyle=c;ctx.fillRect(e.x-14,e.y-e.r-8,28*e.hp/e.maxhp,3)}}for(const b of bullets){circle(b.x,b.y,4,'#efffc6');ctx.strokeStyle='#cfff7290';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.024,b.y-b.vy*.024);ctx.stroke()}for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/.45);if(p.ring)circle(p.x,p.y,p.ring*(1-p.life/.5),null,p.color);else circle(p.x,p.y,2,p.color)}ctx.globalAlpha=1;if(s?.aura)circle(px,py,90+s.aura*15,null,'#ccff7218');circle(px,py,24,'#ccff7210');ctx.save();ctx.translate(px,py);if(soldier.complete&&soldier.naturalWidth){if(s?.inv>0&&Math.floor(s.inv*20)%2)ctx.globalAlpha=.45;ctx.drawImage(soldier,-32,-34,64,64)}else{circle(0,0,15,'#ccff72','#efffc6')}ctx.restore();ctx.textAlign='center';ctx.fillStyle='#e1efeb';ctx.font='12px system-ui';ctx.fillText('중견간부',px,py+34);ctx.restore();if(stick){circle(stick.x,stick.y,46,'#ffffff08','#ffffff35');circle(stick.x+stick.dx*38,stick.y+stick.dy*38,19,'#ccff7255','#ccff7299')}}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('guide').onclick=()=>{if(state==='upgrade'||state==='end')return;const previous=state;if(state==='play')state='paused';show('<div class="eyebrow">RESEARCH INTO PLAY</div><h2>보고서 속 요인이 전장으로</h2><table><thead><tr><th>위협 요인</th><th>대응 정책</th></tr></thead><tbody><tr><td>상대적 박탈감</td><td>책임·직무에 맞는 보상</td></tr><tr><td>업무과중·권한부족</td><td>행정업무 간소화·권한 위임</td></tr><tr><td>경직된 조직문화</td><td>합리적 소통·휴식 보장</td></tr><tr><td>경력불확실성</td><td>예측 가능한 경력관리</td></tr><tr><td>근무지 이동·가족별거</td><td>주거·교육·가족지원 연계</td></tr></tbody></table><p>여러 부담이 누적되며 이탈을 다시 부르는 구조를 최종 위협 <b>「이탈의 악순환」</b>으로 재구성했습니다.</p><p class="note">근거: 「(260906) 내용 작성 중(9)」 Ⅵ장 델파이 분석 및 Ⅶ장 정책적 시사점. 명칭은 게임에 맞게 축약했습니다. 공격력·출현 빈도·강화 수치는 게임 설정으로, 보고서 가중치나 실증적 정책 효과를 뜻하지 않습니다.</p><button class="primary" id="closeguide">돌아가기</button>');$('closeguide').onclick=()=>{if(previous==='start'){state='start';intro()}else if(previous==='paused'){state='play';pause()}else resume()}};
